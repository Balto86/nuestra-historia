<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- PANTALLA INICIAL (SOBRE) --- */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            text-align: center;
            padding: 20px;
        }
        .sobre-icono {
            font-size: 80px;
            animation: latido 1.5s infinite;
            cursor: pointer;
        }
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        #pantalla-inicio h2 {
            color: white;
            margin: 20px 0;
            font-size: 24px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-abrir {
            background: white;
            color: #d63384;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-abrir:active {
            transform: scale(0.95);
        }

        /* --- LLUVIA DE CORAZONES --- */
        .corazon-lluvia {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: caer linear forwards;
        }
        @keyframes caer {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .contenedor {
            max-width: 450px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
            text-align: center;
        }
        h1 {
            color: #d63384;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .subtitulo {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* --- CONTADOR --- */
        .contador {
            display: flex;
            justify-content: space-around;
            background: #ffe6ee;
            padding: 15px 10px;
            border-radius: 15px;
            margin: 15px 0;
        }
        .tiempo {
            font-size: 12px;
            color: #555;
        }
        .tiempo span {
            display: block;
            font-size: 22px;
            font-weight: bold;
            color: #d63384;
        }

        /* --- CARRUSEL DE FOTOS --- */
        .carrusel-contenedor {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .carrusel-slide {
            display: none;
            width: 100%;
            height: 100%;
        }
        .carrusel-slide.activo {
            display: block;
            animation: fade 0.6s;
        }
        .carrusel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes fade {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
        .btn-carrusel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            color: #d63384;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* --- CARTA Y BOTÓN MÚSICA --- */
        .carta {
            text-align: left;
            line-height: 1.6;
            margin-top: 15px;
            font-size: 15px;
            background: #fff5f8;
            padding: 15px;
            border-radius: 15px;
            border-left: 4px solid #d63384;
        }
        .btn-musica {
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div class="sobre-icono" onclick="abrirRegalo()">💌</div>
        <h2>Tienes una sorpresa especial...</h2>
        <button class="btn-abrir" onclick="abrirRegalo()">Abrir regalo ✨</button>
    </div>

    <div class="contenedor">
        <h1>Tú & Yo ❤️</h1>
        <p class="subtitulo">Cada segundo a tu lado cuenta</p>

        <div class="contador">
            <div class="tiempo"><span id="dias">0</span>Días</div>
            <div class="tiempo"><span id="horas">0</span>Horas</div>
            <div class="tiempo"><span id="minutos">0</span>Min</div>
            <div class="tiempo"><span id="segundos">0</span>Seg</div>
        </div>

        <audio id="musica" loop>
            <source src="cancion.mp3" type="audio/mpeg">
        </audio>
        <button class="btn-musica" id="btn-audio" onclick="toggleMusica()">⏸️ Pausar música</button>

               <div class="carrusel-contenedor">
            <div class="carrusel-slide activo">
                <img src="foto1.jpg" alt="Recuerdo 1">
            </div>
            <div class="carrusel-slide">
                <img src="foto2.jpg" alt="Recuerdo 2">
            </div>
            <div class="carrusel-slide">
                <img src="foto3.jpg" alt="Recuerdo 3">
            </div>
            <div class="carrusel-slide">
                <img src="foto4.jpg" alt="Recuerdo 4">
            </div>
            <div class="carrusel-slide">
                <img src="foto5.jpg" alt="Recuerdo 5">
            </div>
            <div class="carrusel-slide">
                <img src="foto6.jpg" alt="Recuerdo 6">
            </div>
            <div class="carrusel-slide">
                <img src="foto7.jpg" alt="Recuerdo 7">
            </div>
            <div class="carrusel-slide">
                <img src="foto8.jpg" alt="Recuerdo 8">
            </div>
            <div class="carrusel-slide">
                <img src="foto9.jpg" alt="Recuerdo 9">
            </div>
            <div class="carrusel-slide">
                <img src="foto10.jpg" alt="Recuerdo 10">
            </div>
            <div class="carrusel-slide">
                <img src="foto11.jpg" alt="Recuerdo 11">
            </div>
            <div class="carrusel-slide">
                <img src="foto12.jpg" alt="Recuerdo 12">
            </div>
            <div class="carrusel-slide">
                <img src="foto13.jpg" alt="Recuerdo 13">
            </div>
            <div class="carrusel-slide">
                <img src="foto14.jpg" alt="Recuerdo 14">
            </div>
            <div class="carrusel-slide">
                <img src="foto15.jpg" alt="Recuerdo 15">
            </div>
            <div class="carrusel-slide">
                <img src="foto16.jpg" alt="Recuerdo 16">
            </div>
            <div class="carrusel-slide">
                <img src="foto17.jpg" alt="Recuerdo 17">
            </div>

            <button class="btn-carrusel prev" onclick="cambiarFoto(-1)">❮</button>
            <button class="btn-carrusel next" onclick="cambiarFoto(1)">❯</button>
        </div>

        <div class="carta">
            <p><strong>Mi amor,</strong></p>
            <p>Quise guardar un pedacito de nuestra historia aquí. Gracias por las risas, la complicidad y por hacer que cada día valga la pena. Te amo muchísimo.</p>
        </div>
    </div>


       <script>
        // 1. FECHA DE INICIO: 17 de Marzo de 2026
        const fechaInicio = new Date(2026, 2, 17, 0, 0, 0);

        function actualizarContador() {
            const ahora = new Date();
            const diferencia = ahora - fechaInicio;

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
            const minutos = Math.floor((diferencia / 1000 / 60) % 60);
            const segundos = Math.floor((diferencia / 1000) % 60);

            document.getElementById("dias").innerText = dias;
            document.getElementById("horas").innerText = horas;
            document.getElementById("minutos").innerText = minutos;
            document.getElementById("segundos").innerText = segundos;
        }
        setInterval(actualizarContador, 1000);
        actualizarContador();

        // 2. ABRIR REGALO Y ACTIVAR MÚSICA
        function abrirRegalo() {
            const pantalla = document.getElementById("pantalla-inicio");
            pantalla.style.opacity = "0";
            setTimeout(() => {
                pantalla.style.display = "none";
            }, 800);

            const audio = document.getElementById("musica");
            const btnAudio = document.getElementById("btn-audio");
            if (audio) {
                audio.play().catch(() => {
                    if (btnAudio) btnAudio.innerText = "▶️ Reproducir música";
                });
            }
        }

        function toggleMusica() {
            const audio = document.getElementById("musica");
            const btnAudio = document.getElementById("btn-audio");
            if (audio.paused) {
                audio.play();
                btnAudio.innerText = "⏸️ Pausar música";
            } else {
                audio.pause();
                btnAudio.innerText = "▶️ Reproducir música";
            }
        }

        // 3. CARRUSEL DE FOTOS
        let indiceActual = 0;
        const slides = document.querySelectorAll(".carrusel-slide");

        function cambiarFoto(direccion) {
            if (slides.length === 0) return;
            slides[indiceActual].classList.remove("activo");
            indiceActual = (indiceActual + direccion + slides.length) % slides.length;
            slides[indiceActual].classList.add("activo");
        }
        setInterval(() => cambiarFoto(1), 4000);

        // 4. LLUVIA DE CORAZONES
        function crearCorazon() {
            const corazon = document.createElement("div");
            corazon.classList.add("corazon-lluvia");
            const iconos = ["❤️", "💖", "💕", "💗", "🌸"];
            corazon.innerText = iconos[Math.floor(Math.random() * iconos.length)];
            
            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.animationDuration = (Math.random() * 3 + 3) + "s";
            corazon.style.fontSize = (Math.random() * 15 + 15) + "px";
            
            document.body.appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 6000);
        }
        setInterval(crearCorazon, 400);
    </script>

</body>
</html>
